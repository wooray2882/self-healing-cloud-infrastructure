apiVersion: v1
kind: ServiceAccount
metadata:
  name: healops-backend-sa
  namespace: default
  annotations:
    # This annotation connects the Kubernetes Service Account to the AWS IAM Role
    # (IRSA) created in the Terraform module. Replace <ACCOUNT_ID> in production.
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/healops-dev-backend-role
