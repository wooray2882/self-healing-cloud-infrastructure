apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
  labels:
    role: alert-rules
    prometheus: healops
data:
  self-healing.rules.yaml: |
    groups:
      - name: healops.rules
        rules:
          # Alert 1: High CPU Usage
          - alert: HighCPUUsage
            expr: sum(rate(container_cpu_usage_seconds_total{namespace="default", container="backend"}[1m])) by (pod) > 0.8
            for: 1m
            labels:
              severity: warning
              tier: backend
            annotations:
              summary: "High CPU usage detected on backend pod"
              description: "Pod {{ $labels.pod }} is using > 80% CPU for more than 1 minute."

          # Alert 2: High Memory Usage
          - alert: HighMemoryUsage
            expr: sum(container_memory_working_set_bytes{namespace="default", container="backend"}) by (pod) / sum(container_spec_memory_limit_bytes{namespace="default", container="backend"}) by (pod) > 0.85
            for: 1m
            labels:
              severity: warning
              tier: backend
            annotations:
              summary: "High Memory usage detected on backend pod"
              description: "Pod {{ $labels.pod }} is using > 85% Memory for more than 1 minute."

          # Alert 3: Pod CrashLooping
          - alert: PodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total{namespace="default", container="backend"}[5m]) * 300 > 3
            for: 1m
            labels:
              severity: critical
              tier: backend
            annotations:
              summary: "Backend pod is crash looping"
              description: "Pod {{ $labels.pod }} has restarted more than 3 times in the last 5 minutes."
