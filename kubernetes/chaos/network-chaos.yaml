apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: backend-network-delay
  namespace: default
spec:
  action: delay # Adds network latency to simulate a struggling backend
  mode: all
  selector:
    labelSelectors:
      app: healops-backend
  delay:
    latency: '500ms'
    correlation: '100'
    jitter: '0ms'
  duration: '60s' # Only run the chaos experiment for 60 seconds
