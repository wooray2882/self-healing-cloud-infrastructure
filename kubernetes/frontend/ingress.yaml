apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healops-ingress
  namespace: default
  annotations:
    # AWS Application Load Balancer (ALB) Controller annotations
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    
    # Optional: If using HTTPS/ACM, you'd add the certificate ARN here
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:...
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: healops-backend-svc
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: healops-frontend-svc
                port:
                  number: 80
