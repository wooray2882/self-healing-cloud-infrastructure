apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healops-ingress
  namespace: default
  annotations:
    # AWS Application Load Balancer (ALB) Controller annotations
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:000622214837:certificate/29c42e01-10a5-4bc3-812e-09429ec057e4
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: healops-backend-svc
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: healops-frontend-svc
                port:
                  number: 80
